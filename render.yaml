services:
  - type: web
    name: nishchay
    runtime: node
    plan: free
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    healthCheckPath: "/api/health"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: "storage/uploads"
